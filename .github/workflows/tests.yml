# Environment-free test gates.
#
# Runs the two suites that need nothing beyond a Rust toolchain:
#   - unit tests (`--lib`): line-map translation, path reverse,
#     analyzer/emit internals — no subprocess, no fixtures.
#   - emit_snapshots: the primary emit-shape gate. Spawns only our own
#     binary (`--emit-ts`); no tsgo, no node, no submodule. Snapshot
#     hashes are keyed to workspace-relative paths, so the committed
#     `expected.emit.ts` files compare byte-identically on any checkout.
#
# The tsgo-backed suites (bug_fixtures, ls_diagnostics, upstream_sanity)
# need a node_modules with a native-compiler install plus the
# language-tools submodule — they stay local until that setup is scripted
# for CI.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + emit snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace --lib
      - name: Emit snapshots
        run: cargo test --test emit_snapshots
