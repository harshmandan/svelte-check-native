[package]
name = "svn-analyze"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
svn-core = { path = "../core" }
svn-parser = { path = "../parser" }
smol_str.workspace = true
unicode-ident.workspace = true
indexmap.workspace = true
smallvec.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_span.workspace = true

# No doctests in this crate. Building the rustdoc harness for every crate
# cost roughly 40s on a full `cargo test --workspace` — most of the run —
# for a workspace that has exactly one real doctest, in svn-core. That one
# still runs; these do not need to.
[lib]
doctest = false
