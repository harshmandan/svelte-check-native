[package]
name = "svn-enhance"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
svn-core = { path = "../core" }
svn-parser = { path = "../parser" }
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
# Real TS/node module resolution (tsconfig `paths`, node_modules,
# package.json `exports`) so we resolve `.svelte` specifiers of every
# form the way tsgo would — no hand-rolled resolution. See crate docs.
oxc_resolver = "11"
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

# No doctests in this crate. Building the rustdoc harness for every crate
# cost roughly 40s on a full `cargo test --workspace` — most of the run —
# for a workspace that has exactly one real doctest, in svn-core. That one
# still runs; these do not need to.
[lib]
doctest = false
