[package]
name = "svn-parser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
svn-core = { path = "../core" }
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_diagnostics.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
smol_str.workspace = true
thiserror.workspace = true
memchr.workspace = true

# No doctests in this crate. Building the rustdoc harness for every crate
# cost roughly 40s on a full `cargo test --workspace` — most of the run —
# for a workspace that has exactly one real doctest, in svn-core. That one
# still runs; these do not need to.
[lib]
doctest = false
