[package]
name = "svn-svelte-compiler"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
svn-core = { path = "../core" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# No doctests in this crate. Building the rustdoc harness for every crate
# cost roughly 40s on a full `cargo test --workspace` — most of the run —
# for a workspace that has exactly one real doctest, in svn-core. That one
# still runs; these do not need to.
[lib]
doctest = false
